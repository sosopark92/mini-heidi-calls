clinic:
  name: Harbour to Sunset GP

# Roles used in assigned_to
roles:
  gp:             "GP - review before callback"
  practice_nurse: "Practice Nurse"
  clinic-manager: "Clinic Manager"
  admin:          "Admin"

# Rules are evaluated in order. First match wins.
routing_rules:
  - match:
      urgency: critical
    assign_to: gp
    reason: "Critical urgency - GP must review before clinic opens"

  - match:
      safety_state: [ACTIVE, WATCH]
    assign_to: gp
    reason: "Clinical concern flagged - GP should review before any callback is made"

  - match:
      urgency: high
    assign_to: gp
    reason: "High urgency - GP review recommended"

  - match:
      any_intent: medication_concern
    assign_to: gp
    reason: "Medication concern - GP should advise on response"

  - match:
      any_intent: referral_request
    assign_to: gp
    reason: "Referral request - GP must authorise"

  - match:
      any_intent: test_results
    assign_to: gp
    reason: "Test results - GP must review before any information is shared with patient"

  - match:
      any_intent: complaint
    assign_to: clinic-manager
    reason: "Formal complaint - escalate to clinic manager"

  - match:
      any_intent: appointment_booking
    assign_to: practice_nurse
    reason: "Appointment booking - practice nurse coordinates health assessments, chronic disease reviews, and immunisation bookings"

  - match:
      any_intent: prescription_repeat
    assign_to: practice_nurse
    reason: "Repeat script - practice nurse processes and forwards to GP for authorisation"

  - default: true
    assign_to: admin
    reason: "Routine call - admin can handle directly"
